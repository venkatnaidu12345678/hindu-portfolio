<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Ravuri Harsha</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2305050a'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='54' font-weight='700' fill='%23b8ff4f' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05050a;--fg:#f5f0ff;--p1:#b8ff4f;--p3:#00e5ff;--glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);color-scheme:dark}
body{
  background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;position:relative;overflow:hidden;
}
:focus-visible{outline:2px solid var(--p1);outline-offset:3px;border-radius:4px}
.mesh{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 50% 40% at 30% 30%,rgba(184,255,79,0.06),transparent 60%),radial-gradient(ellipse 40% 40% at 75% 70%,rgba(0,229,255,0.06),transparent 60%)}
.code{font-family:'Fragment Mono',monospace;font-size:clamp(64px,16vw,160px);font-weight:700;letter-spacing:-4px;color:transparent;-webkit-text-stroke:2px var(--p1);line-height:1;position:relative;z-index:1}
h1{font-size:clamp(20px,3vw,28px);margin-top:16px;font-weight:700;position:relative;z-index:1}
p{color:rgba(255,255,255,0.4);margin-top:12px;max-width:440px;line-height:1.7;font-size:15px;position:relative;z-index:1}
.actions{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;font-size:13px;font-weight:600;text-decoration:none;border-radius:12px;transition:all .3s cubic-bezier(.23,1,.32,1);font-family:'Space Grotesk',sans-serif}
.btn-primary{background:var(--p1);color:#000}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(184,255,79,0.2)}
.btn-ghost{background:var(--glass);color:var(--fg);border:1px solid var(--border)}
.btn-ghost:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.2)}
.tag{font-family:'Fragment Mono',monospace;font-size:10px;color:var(--p3);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;position:relative;z-index:1}
</style>
</head>
<body>
  <div class="mesh" aria-hidden="true"></div>
  <div class="tag">404 · Not Found</div>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for was moved, renamed, or never existed. Head back to the homepage to find projects, OpenOTA, and the rest of Ravuri Harsha's work.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">← Back to Home</a>
    <a href="/#projects" class="btn btn-ghost">View Projects</a>
  </div>
</body>
</html>
